name: prayer_app
description: A Flutter prayer times application with authentication

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # Storage & Preferences
  shared_preferences: ^2.2.2
  
  # Notifications - ✅ DÉJÀ INSTALLÉ
  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.2
  permission_handler: ^11.0.1 
  
  # Date & Time
  hijri: ^3.0.0
  intl: ^0.20.2
  
  # Firebase
  firebase_core: ^3.8.1
  firebase_auth: ^5.3.3
  cloud_firestore: ^5.5.0
  
  # UI & Images
  cupertino_icons: ^1.0.8
  cached_network_image: ^3.3.1
  
  # Compass & Location
  flutter_compass: ^0.8.0
  geolocator: ^10.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Amiri
      fonts:
        - asset: fonts/Amiri-Regular.ttf
        - asset: fonts/Amiri-Bold.ttf
          weight: 700